function App() {
  const now = new Date();
  const [txs, setTxs]       = useState(()=>ls(KEYS.TX,[]));
  const [month, setMonth]   = useState(now.getMonth());
  const [year, setYear]     = useState(now.getFullYear());
  const [filter, setFilter] = useState('all');

  const [searchTerm, setSearchTerm] = useState('');
  const [syncStatus, setSyncStatus] = useState('idle');

  
  const [modalConfig, setModalConfig] = useState({ open: false, type: 'expense', tx: null }); 
  const [activeTab, setActiveTab] = useState('home');
  const [currentUser, setCurrentUser] = useState(() => ls('zg_current_user', null));
  
  const [toast, setToast]   = useState(null);
  const fileRef             = useRef();

  const [theme, setTheme] = useState(() => ls('zg_theme', 'dark'));

  useEffect(() => {
    document.body.setAttribute('data-theme', theme);
    lsSet('zg_theme', theme);
  }, [theme]);

  useEffect(() => {
    if (currentUser) lsSet('zg_current_user', currentUser);
  }, [currentUser]);

  const toggleTheme = () => {
    setTheme(p => p === 'dark' ? 'love' : 'dark');
  };

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const action = params.get('action');
    if (action === 'add-expense') {
      setModalConfig({ open: true, type: 'expense', tx: null });
      window.history.replaceState({}, document.title, window.location.pathname);
    } else if (action === 'add-income') {
      setModalConfig({ open: true, type: 'income', tx: null });
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }, []);

  useEffect(() => { lsSet(KEYS.TX, txs); triggerDriveBackup(txs); }, [txs]);

  const showToast = (msg, color='var(--income-color)') => {
    setToast({msg,color}); setTimeout(()=>setToast(null),2600);
  };

  const monthTx = useMemo(()=>
    txs.filter(t=>{const d=new Date(t.date);return d.getMonth()===month&&d.getFullYear()===year;})
       .sort((a,b)=>new Date(b.date)-new Date(a.date))
  ,[txs,month,year]);

  const totalSpend  = useMemo(()=>monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),[monthTx]);
  const totalIncome = useMemo(()=>monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),[monthTx]);
  const balance     = totalIncome-totalSpend;
  const budgetPct   = totalIncome>0 ? (totalSpend/totalIncome)*100 : 0;

  // DATOS MES ANTERIOR (COMPARATIVA)
  const prevMonthNum = month === 0 ? 11 : month - 1;
  const prevYearNum  = month === 0 ? year - 1 : year;
  
  const prevMonthTx  = useMemo(()=>
    txs.filter(t=>{const d=new Date(t.date);return d.getMonth()===prevMonthNum&&d.getFullYear()===prevYearNum;})
  ,[txs,month,year]);

  const prevTotalSpend  = useMemo(()=>prevMonthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),[prevMonthTx]);
  const prevTotalIncome = useMemo(()=>prevMonthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),[prevMonthTx]);

  const getDiff = (curr, prev, reverseColors = false) => {
    if (!prev || prev === 0) return null; 
    const diff = ((curr - prev) / prev) * 100;
    if (Math.abs(diff) < 0.1) return null; 
    
    const isGood = reverseColors ? diff <= 0 : diff >= 0;
    return { 
      value: diff, 
      formatted: `${diff > 0 ? '+' : ''}${diff.toFixed(1)}%`,
      color: isGood ? 'var(--income-color)' : 'var(--spend-color)',
      bg: isGood ? 'var(--income-bg)' : 'var(--spend-bg)'
    };
  };

  const spendDiff = getDiff(totalSpend, prevTotalSpend, true); 
  const incomeDiff = getDiff(totalIncome, prevTotalIncome, false); 

  // DATOS GLOBALES PARA EL AUTO-AHORRO
  const globalTotalSpend  = useMemo(()=>txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),[txs]);
  const globalTotalIncome = useMemo(()=>txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),[txs]);
  const globalBalance     = globalTotalIncome - globalTotalSpend;

    const displayTx = useMemo(()=>{
    let arr = filter==='all' ? monthTx : monthTx.filter(t=>t.type===filter);
    if(searchTerm.trim()!==''){
       const s = searchTerm.toLowerCase();
       arr = arr.filter(t => t.concept.toLowerCase().includes(s) || t.tipo.toLowerCase().includes(s) || (t.customTipo && t.customTipo.toLowerCase().includes(s)));
    }
    return arr;
  },[monthTx,filter,searchTerm]);

  const prevMonth = ()=>{ if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextMonth = ()=>{ if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };

  const saveTx = (tx, isEdit) => { 
    if (Array.isArray(tx)) {
      setTxs(p => [...tx, ...p]);
      showToast('Registros mixtos guardados', 'var(--accent-color)');
    } else if (isEdit) {
      setTxs(p => p.map(t => t.id === tx.id ? tx : t));
      showToast('Registro actualizado', 'var(--accent-color)');
    } else {
      setTxs(p => [tx, ...p]); 
      showToast('Movimiento registrado', tx.type==='income'?'var(--income-color)':'var(--spend-color)'); 
    }
    
  };
  
  // Procesador de recurrentes al inicio
  useEffect(() => {
    if (txs.length === 0) return;
    let modified = false;
    const today = new Date().toISOString().slice(0,10);
    const newTxs = [];
    
    const updatedTxs = txs.map(t => {
      if (t.recurring && t.nextChargeDate && t.nextChargeDate <= today) {
        modified = true;
        
        // El próximo cargo para la suscripción
        const nextDateObj = new Date(t.nextChargeDate);
        nextDateObj.setMonth(nextDateObj.getMonth() + 1);
        const newNextChargeDate = nextDateObj.toISOString().slice(0,10);
        
        // Creamos la transacción que acaba de cobrar
        const chargedTx = { ...t, id: genId(), date: t.nextChargeDate, nextChargeDate: null, recurring: false };
        newTxs.push(chargedTx);
        
        // Actualizamos la original
        return { ...t, nextChargeDate: newNextChargeDate };
      }
      return t;
    });

    if (modified) {
      setTxs([...newTxs, ...updatedTxs]);
      showToast(`${newTxs.length} pagos recurrentes procesados`, 'var(--accent-color)');
    }
  }, [txs]);

  
  // ── GOOGLE DRIVE SYNC LOGIC ──
  const CLIENT_ID = '544307324099-mat8dttoppk6t7kjpeijmg57390jufjo.apps.googleusercontent.com';
  const SCOPES = 'https://www.googleapis.com/auth/drive.appdata';
  
  const [gapiInited, setGapiInited] = useState(false);
  const [tokenClient, setTokenClient] = useState(null);
  const [driveToken, setDriveToken] = useState(null);

  useEffect(() => {
    const initGapi = () => {
      window.gapi.client.init({
        discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
      }).then(() => setGapiInited(true)).catch(e => console.error('GAPI error:', e));
    };

    if (window.gapi) {
      window.gapi.load('client', initGapi);
    }
    if (window.google) {
      const tc = window.google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            setDriveToken(tokenResponse.access_token);
            performFullSync(tokenResponse.access_token);
          }
        }
      });
      setTokenClient(tc);
    }
  }, []);

  const performFullSync = async (token) => {
    setSyncStatus('syncing');
    try {
      const listRes = await window.gapi.client.drive.files.list({
        spaces: 'appDataFolder',
        q: "name='zengastos_data.json'",
        fields: 'files(id)'
      });
      const files = listRes.result.files;

      if (files && files.length > 0) {
        const fileId = files[0].id;
        const res = await window.gapi.client.drive.files.get({ fileId: fileId, alt: 'media' });
        const remoteData = res.result;
        
        if (remoteData && Array.isArray(remoteData)) {
          // Merge preserving local data
          setTxs(prev => {
            const ids = new Set(prev.map(t=>t.id));
            const newFromRemote = remoteData.filter(t => !ids.has(t.id));
            if (newFromRemote.length > 0) {
              const merged = [...prev, ...newFromRemote];
              uploadToDrive(fileId, merged, token); // Sube el mix de vuelta
              return merged;
            } else {
              uploadToDrive(fileId, prev, token); // Ya está todo, solo actualiza la nube
              return prev;
            }
          });
          showToast('Sincronizado con Drive', 'var(--income-color)');
        } else {
          uploadToDrive(fileId, txs, token);
        }
      } else {
        await createInDrive(txs, token);
        showToast('Backup inicial creado', 'var(--income-color)');
      }
    } catch(e) {
      console.error(e);
      showToast('Error al sincronizar', 'var(--spend-color)');
    }
    setSyncStatus('idle');
  };

  const createInDrive = async (data, token) => {
    const file = new Blob([JSON.stringify(data)], {type: 'application/json'});
    const metadata = new Blob([JSON.stringify({ name: 'zengastos_data.json', parents: ['appDataFolder'] })], {type: 'application/json'});
    const form = new FormData();
    form.append('metadata', metadata);
    form.append('file', file);
    await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token },
      body: form
    });
  };

  const uploadToDrive = async (fileId, data, token) => {
    const file = new Blob([JSON.stringify(data)], {type: 'application/json'});
    await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method: 'PATCH',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: file
    });
  };

  const handleDriveSync = () => {
    if (!gapiInited || !tokenClient) {
      showToast('Cargando servicios de Google...', 'var(--text-dim)');
      return;
    }
    tokenClient.requestAccessToken({ prompt: 'consent' });
  };
  
  const triggerDriveBackup = (latestTxs) => {
    if (driveToken && window.gapi && window.gapi.client.getToken()) {
      window.gapi.client.drive.files.list({ spaces: 'appDataFolder', q: "name='zengastos_data.json'" }).then(res => {
        if (res.result.files && res.result.files.length > 0) {
          uploadToDrive(res.result.files[0].id, latestTxs, driveToken);
        }
      });
    }
  };
  // ── END GOOGLE DRIVE SYNC LOGIC ──

  
  const delTx  = (id) => { setTxs(p=>p.filter(t=>t.id!==id)); showToast('Eliminado','var(--spend-color)'); };

  const doExport = ()=>{ exportCSV(txs,month,year); showToast(`Exportado: ${MONTHS[month]} ${year}`, 'var(--accent-color)'); };
  const doImport = (e)=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      const parsed=parseCSV(ev.target.result);
      if(!parsed.length){showToast('CSV vacío o inválido','var(--spend-color)');return;}
      setTxs(prev=>{ 
        const ids=new Set(prev.map(t=>t.id)); 
        return [...prev,...parsed.filter(t=>!ids.has(t.id))]; 
      });
      showToast(`${parsed.length} movimientos importados`, 'var(--income-color)');
    };
    r.readAsText(f); e.target.value='';
  };

  const segBtn = (label,val)=>(
    <button onClick={()=>setFilter(val)} className={`seg-btn ${filter===val?'active':''}`}>{label}</button>
  );

  return (
    <div className="min-h-screen px-4 pt-8 pb-32 max-w-[1200px] mx-auto space-y-6">
      {toast && <Toast msg={toast.msg} color={toast.color}/>}
      <input ref={fileRef} type="file" accept=".csv, text/csv, application/vnd.ms-excel, application/csv, text/x-csv, application/x-csv, text/comma-separated-values, text/x-comma-separated-values" className="hidden" onChange={doImport}/>

      {/* ── HEADER ── */}
      <header className="flex items-center justify-between gap-6 flex-wrap pb-2">
        <div className="flex items-center gap-4">
          <img src="icon.png" alt="Logo" className="w-11 h-11 rounded-2xl object-cover shadow-xl border" style={{borderColor: 'var(--border-color)'}}
               onError={e=>{ e.target.style.display='none'; }}/>
          <div>
            <h1 className="font-serif text-[28px] italic leading-none tracking-tight" style={{color: 'var(--text-main)'}}>ZenGastos</h1>
            <p className="text-[11px] font-mono mt-1 tracking-widest uppercase" style={{color: 'var(--text-dim)'}}>finanzas compartidas</p>
          </div>
        </div>

        <div className="glass rounded-xl flex items-center gap-1 p-1 shadow-lg">
          <button onClick={prevMonth} className="p-2.5 rounded-lg transition-all hover:opacity-70" style={{color: 'var(--text-dim)'}}>
            <LI name="ChevronLeft" size={18}/>
          </button>
          <span className="px-4 font-semibold text-[15px] min-w-[150px] text-center" style={{color: 'var(--text-main)'}}>
            {MONTHS[month]} <span className="font-mono ml-1" style={{color: 'var(--text-dim)'}}>{year}</span>
          </span>
          <button onClick={nextMonth} className="p-2.5 rounded-lg transition-all hover:opacity-70" style={{color: 'var(--text-dim)'}}>
            <LI name="ChevronRight" size={18}/>
          </button>
        </div>

        <div className="flex gap-1.5 sm:gap-2 items-center flex-wrap justify-end">
          <button onClick={() => setCurrentUser(null)}
            className="flex items-center gap-1.5 px-2.5 sm:px-4 py-2.5 glass rounded-xl text-xs font-bold transition-all shadow-md" 
            style={{color: 'var(--text-main)', border: '1px solid var(--accent-color)', background: 'var(--accent-bg)'}}>
            {currentUser ? currentUser.split(' ')[1] : '👤'} <span>{currentUser ? currentUser.split(' ')[0] : 'Usuario'}</span>
          </button>
          <button onClick={handleDriveSync} title="Sincronizar nube"
            className="flex items-center gap-1.5 px-2.5 sm:px-4 py-2.5 glass rounded-xl text-xs font-bold transition-all shadow-md" style={{color: 'var(--text-main)', border: syncStatus==='syncing'?'1px solid var(--accent-color)':'1px solid transparent'}}>
            <LI name="Cloud" size={15}/> <span>{syncStatus==='syncing'?'Sincronizando...':'Sync'}</span>
          </button>
          <button onClick={doExport} title="Exportar CSV"
            className="flex items-center gap-1.5 px-2.5 sm:px-4 py-2.5 glass rounded-xl text-xs font-bold transition-all shadow-md" style={{color: 'var(--text-dim)'}}>
            <LI name="Download" size={15}/> <span className="hidden md:inline">Exportar</span>
          </button>
          <button onClick={()=>fileRef.current.click()} title="Importar CSV"
            className="flex items-center gap-1.5 px-2.5 sm:px-4 py-2.5 glass rounded-xl text-xs font-bold transition-all shadow-md" style={{color: 'var(--text-dim)'}}>
            <LI name="Upload" size={15}/> <span className="hidden md:inline">Importar</span>
          </button>
          <button onClick={toggleTheme} title="Cambiar Tema"
            className="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 glass rounded-xl transition-all shadow-md" style={{color: 'var(--text-main)'}}>
            <LI name={theme === 'dark' ? 'Heart' : 'Moon'} size={16}/>
          </button>
        </div>
      </header>

      
      {activeTab === 'home' && (
        <div className="space-y-6 anim-fadeup">
          {/* ── SUMMARY CARDS ── */}
      <div className="grid grid-cols-4 gap-4 summary-4">
        <SummaryCard label="Gastos" value={fmtEur(totalSpend)} color="var(--spend-color)"
          sub="este mes" icon={<LI name="TrendingDown" size={16}/>} delay="delay-1" diff={spendDiff}/>
        <SummaryCard label="Ingresos" value={fmtEur(totalIncome)} color="var(--income-color)"
          sub="este mes" icon={<LI name="TrendingUp" size={16}/>} delay="delay-2" diff={incomeDiff}/>
        <SummaryCard label="Balance" value={fmtEur(balance)} color={balance>=0?'var(--income-color)':'var(--spend-color)'}
          sub={balance>=0?'en positivo':'en déficit'} icon={<LI name="Wallet" size={16}/>} delay="delay-3"/>
        <SummaryCard label="% Presupuesto" value={budgetPct.toFixed(1)+'%'} color="var(--accent-color)"
          sub={totalIncome>0?`${fmtEur(totalSpend)} de ${fmtEur(totalIncome)}`:'sin ingresos'}
          icon={<LI name="Activity" size={16}/>} delay="delay-4"/>
      </div>

      {/* ── CATEGORY ROW CARDS ── */}
      <CategoryRowCards monthTx={monthTx} totalSpend={totalSpend} />

      {/* ── MAIN 2-COLUMN GRID ── */}
      <div className="grid gap-6 two-col pt-2" style={{gridTemplateColumns:'1fr 380px'}}>

        {/* LEFT: Transactions */}
        <div className="glass rounded-2xl p-6 space-y-5 flex flex-col min-h-[500px]">
          <div className="flex flex-col gap-4 border-b pb-4" style={{borderColor: 'var(--border-color)'}}>
            <div className="flex items-center justify-between flex-wrap gap-4">
              <div className="seg-wrap w-full max-w-[300px]">
                {segBtn('Todo','all')}
                {segBtn('Gastos','expense')}
                {segBtn('Ingresos','income')}
              </div>
              <span className="font-mono text-xs font-medium px-3 py-1.5 rounded-lg border" style={{color: 'var(--text-dim)', background: 'var(--raised-bg)', borderColor: 'var(--border-color)'}}>{displayTx.length} items</span>
            </div>
            <div className="relative w-full">
              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <LI name="Search" size={16} style={{color: 'var(--text-dim)'}}/>
              </div>
              <input type="text" placeholder="Buscar movimientos por concepto o categoría..." 
                className="f-input w-full pl-10" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <button onClick={()=>setModalConfig({ open: true, type: 'expense', tx: null })} 
              className="flex items-center justify-center gap-2 py-3 rounded-xl text-[14.5px] font-bold transition-all shadow-sm hover:-translate-y-0.5"
              style={{color: 'var(--spend-color)', background: 'var(--spend-bg)', border: '1px solid var(--border-color)'}}>
              <LI name="MinusCircle" size={18}/> Añadir Gasto
            </button>
            <button onClick={()=>setModalConfig({ open: true, type: 'income', tx: null })} 
              className="flex items-center justify-center gap-2 py-3 rounded-xl text-[14.5px] font-bold transition-all shadow-sm hover:-translate-y-0.5"
              style={{color: 'var(--income-color)', background: 'var(--income-bg)', border: '1px solid var(--border-color)'}}>
              <LI name="PlusCircle" size={18}/> Añadir Ingreso
            </button>
          </div>

          <div className="flex-1 overflow-y-auto pr-2 space-y-1 mt-2">
            {displayTx.length===0
              ? <div className="h-full flex flex-col items-center justify-center py-16 space-y-4 opacity-40">
                  <LI name="Receipt" size={48} style={{color: 'var(--text-dim)'}}/>
                  <p className="text-[15px] font-medium" style={{color: 'var(--text-dim)'}}>Sin movimientos en este mes</p>
                </div>
              : displayTx.map(tx=><TxRow key={tx.id} tx={tx} onEdit={(tx)=>setModalConfig({ open: true, type: tx.type, tx })} onDelete={delTx}/>)
            }
          </div>
        </div>

        {/* RIGHT: Widgets */}
        <div className="space-y-6">
          <MonthSummaryWidget balance={balance} />
          <SettlementWidget monthTx={monthTx} currentUser={currentUser} />
          <BalanceChartWidget totalIncome={totalIncome} totalSpend={totalSpend} />
          <BudgetWidget totalSpend={totalSpend}/>
          <CategoryWidget monthTx={monthTx}/>
          <GoalsWidget globalBalance={globalBalance} />
        </div>
      </div>

      
        </div>
      )}

      {activeTab === 'calendar' && (
        <CalendarView monthTx={monthTx} month={month} year={year} />
      )}

      {activeTab === 'year' && (
        <AnnualReportView txs={txs} year={year} />
      )}

      {/* ── BOTTOM NAVIGATION ── */}
      <div className="fixed bottom-2 sm:bottom-4 left-0 right-0 z-[9999] p-4 pointer-events-none flex justify-center pb-6">
        <div className="glass rounded-2xl flex items-center p-1.5 gap-1.5 pointer-events-auto shadow-2xl border" style={{borderColor: 'var(--border-color)', background: 'var(--glass-bg)'}}>
          <button onClick={() => setActiveTab('home')} className={`px-4 py-2.5 rounded-xl flex items-center gap-2 font-bold transition-all ${activeTab==='home'?'bg-[var(--accent-bg)] text-[var(--accent-color)] shadow-sm':'text-[var(--text-dim)] hover:text-[var(--text-main)] hover:bg-[var(--raised-bg)]'}`}>
            <LI name="Home" size={18}/> <span className="hidden sm:inline text-[11px] uppercase tracking-widest">Inicio</span>
          </button>
          <button onClick={() => setActiveTab('calendar')} className={`px-4 py-2.5 rounded-xl flex items-center gap-2 font-bold transition-all ${activeTab==='calendar'?'bg-[var(--accent-bg)] text-[var(--accent-color)] shadow-sm':'text-[var(--text-dim)] hover:text-[var(--text-main)] hover:bg-[var(--raised-bg)]'}`}>
            <LI name="Calendar" size={18}/> <span className="hidden sm:inline text-[11px] uppercase tracking-widest">Calendario</span>
          </button>
          <button onClick={() => setActiveTab('year')} className={`px-4 py-2.5 rounded-xl flex items-center gap-2 font-bold transition-all ${activeTab==='year'?'bg-[var(--accent-bg)] text-[var(--accent-color)] shadow-sm':'text-[var(--text-dim)] hover:text-[var(--text-main)] hover:bg-[var(--raised-bg)]'}`}>
            <LI name="TrendingUp" size={18}/> <span className="hidden sm:inline text-[11px] uppercase tracking-widest">Resumen</span>
          </button>
        </div>
      </div>

      <p className="text-center text-[11px] font-mono pt-6 pb-2 opacity-50 tracking-widest uppercase" style={{color: 'var(--text-dim)'}}>
        ZenGastos Pro · {txs.length} Registros Locales
      </p>

      {/* User Selection Modal */}
      {!currentUser && (
        <Modal title="Selecciona tu perfil">
          <div className="space-y-4">
            <p className="text-sm text-center mb-4" style={{color: 'var(--text-dim)'}}>
              Elige tu perfil para asignar correctamente los gastos o ingresos.
            </p>
            <div className="grid grid-cols-2 gap-4">
              {USERS.map(u => {
                const isDani = u.toLowerCase().includes('dani');
                return (
                  <button key={u} onClick={() => setCurrentUser(u)}
                    className="py-8 rounded-2xl font-bold transition-all shadow-lg flex flex-col items-center justify-center gap-3 hover:-translate-y-1"
                    style={{ 
                      background: 'var(--raised-bg)', 
                      border: `2px solid ${isDani ? 'var(--accent-color)' : 'var(--gold-color)'}`, 
                      color: 'var(--text-main)' 
                    }}>
                    <span className="text-4xl">{u.split(' ')[1]}</span>
                    <span className="text-lg">{u.split(' ')[0]}</span>
                  </button>
                )
              })}
            </div>
          </div>
        </Modal>
      )}

      {/* Add / Edit TX Modal */}
      {modalConfig.open && (
        <AddTxModal 
          theme={theme}
          type={modalConfig.type} 
          initialData={modalConfig.tx} 
          currentUser={currentUser}
          onSave={saveTx} 
          onClose={()=>setModalConfig({ open: false, type: 'expense', tx: null })} 
          month={month} 
          year={year}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ErrorBoundary>
    <App/>
  </ErrorBoundary>
);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js')
      .catch(e=>console.warn('[ZenGastos] SW error',e));
  });
}
</script>
</body>
</html>
